<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dart - Instalaciones recomendadas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen">
    <div id="menu"></div>

    <div class="max-w-4xl mx-auto px-4 py-10">
        <div class="flex flex-col md:flex-row justify-center items-center gap-8 mb-10">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Dart_programming_language_logo.svg/1280px-Dart_programming_language_logo.svg.png"
                alt="Dart Logo" class="w-48 md:w-64" />
        </div>

        <h1 class="text-3xl font-bold text-center mb-4">Lenguaje Dart - Instalaciones recomendadas</h1>

        <!-- Video centrado -->
        <section class="mb-12 flex justify-center">
            <a href="https://youtu.be/-DJT5rfFq6M"><img src="images/01_DART_Entorno-Cover.jpg" alt="Entorno de Dart" class="rounded-lg shadow-lg w-full max-w-3xl"></a>
        </section>

        
    </div>

    <script>
        fetch("menu.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("menu").innerHTML = data;
            });
    </script>
</body>
</html>
